## 4. Consumer Flow — Screen by Screen

### Screen 1: Landing Page
**Purpose:** Instantly split the user into the right path.

**Elements:**
- "GrahakKavach" logo/wordmark at top center
- Tagline below logo: *"Your shield at every purchase"*
- Two large buttons:
  - **"Scan a Product"** (primary, big, colored — this is the main entry point)
  - **"I'm an Officer"** (smaller, secondary button, bottom or corner — de-emphasized since it's a minority use case)
- No login prompt visible unless "Officer" is tapped

**Design note:** Consumer path should feel like 90% of the screen's visual weight — this is your core user.

---

### Screen 2: Scan Screen
**Purpose:** Capture one photo of the product label.

**Elements:**
- Camera viewfinder (primary) + "Upload from gallery" (secondary option)
- Simple on-screen guide: a rectangle outline showing "Fit the label inside this frame"
- Tip text below: *"Make sure MRP, ingredients, and dates are visible"*
- Large capture button (bottom center, thumb-reachable — this is a mobile-first app)

**Design note:** Keep this screen extremely minimal — no clutter, no extra options. One clear action.

---

### Screen 3: Processing Screen
**Purpose:** Show the system is working (OCR + rule engine running).

**Elements:**
- Simple animated loader (avoid generic spinning wheel — use something like a scanning-line animation across the label image for visual feedback)
- Status text that updates: "Reading label..." → "Checking compliance..." → "Analyzing ingredients..."
- Keep this under 3-5 seconds if possible; long waits kill trust in a live demo

---

### Screen 4: Results Screen (Your Most Important Screen)
**Purpose:** Show both outputs clearly, without overwhelming the user.

**Layout — two clearly separated sections, top to bottom:**

```
┌─────────────────────────────────────┐
│   [Product photo thumbnail]           │
├─────────────────────────────────────┤
│  🏛 LEGAL METROLOGY                    │
│  ✅ MRP Present     ✅ Net Quantity     │
│  ✅ Mfg Date        ❌ Consumer Care    │
│  → 1 issue found                       │
├─────────────────────────────────────┤
│  🍽 FOOD SAFETY                        │
│  Health Score: 6/10 ⚠️                 │
│  • Contains Tartrazine (E102)          │
│  • High sodium content                 │
│  • Expiry: Valid until [date]          │
├─────────────────────────────────────┤
│  [File a Complaint]  [Save to History] │
└─────────────────────────────────────┘
```

**Design notes:**
- Use **color coding consistently**: green = compliant/safe, amber = caution, red = violation/harmful — this needs to be instantly scannable, not read word-by-word
- If the product isn't food (e.g., soap, electronics), the Food Safety section should simply not appear — only Legal Metrology shows (auto-detected, as discussed)
- "File a Complaint" button should be visible but not alarming — don't make every result feel like an emergency

---

### Screen 5: Complaint Filing Flow

**Step 1 — Identity Verification**
- Show verification method options as cards: Aadhaar QR / DigiLocker / PAN / Voter ID / DL / Phone OTP
- Brief one-line explainer under each: *"Fastest, no document needed"* (for phone OTP) vs *"Most trusted, instant"* (for Aadhaar QR)
- Clear consent text box before proceeding (per DPDP requirement) — must be explicit, not buried

**Step 2 — Complaint Details (pre-filled where possible)**
- If coming from a scan: auto-fill product name, photo, detected violations, timestamp
- User adds: shop name/location (auto-detect via GPS, editable), description of issue (free text), additional photos if needed
- Severity auto-suggested based on violation type, editable by user if needed

**Step 3 — Review & Submit**
- Summary card showing everything that will be submitted
- Clear statement: *"False complaints are a punishable offense under law"* (deterrent, shown once, not aggressively repeated)
- Submit button

**Step 4 — Confirmation**
- Tracking ID displayed prominently
- Message: "Your complaint has been routed to [Department Name(s)]"
- Option to track status later from "My Complaints"

---

### Screen 6: Shop History Lookup
**Purpose:** Let anyone check a shop's track record before buying.

**Elements:**
- Search bar (shop name or use current location to suggest nearby shops)
- Result card per shop: name, address, last inspection date, compliance status, number of resolved complaints
- Tap into a shop for full history timeline

---

## 5. Officer Flow — Screen by Screen

### Screen 1: Officer Login
- Simple, formal login form (ID + password, or OTP-based)
- No decorative elements — this should feel like a professional government tool, not a consumer app

### Screen 2: Officer Dashboard
- Two tabs: **"My Inspections"** and **"Citizen Complaints Queue"**
- Complaints queue sorted by priority score (severity + evidence strength + aging + repeat pattern, as defined earlier)
- Simple table/list view: shop name, issue type, date, status, priority flag

### Screen 3: Log New Inspection (Form)
- Shop details (name, address, auto-GPS)
- Scan product on-site (reuses the same scan engine as consumer side)
- System auto-fills detected compliance results; officer can confirm or override
- Decision buttons: **"Mark Compliant"** / **"Compound Offence"** / **"Escalate to Prosecution"**
- Submit — this becomes a permanent record

---

## 6. Navigation Pattern

- **Consumer app:** bottom navigation bar (mobile-first) with 3 icons — Scan (center, primary), Complaints, Shop History
- **Officer dashboard:** sidebar navigation (desktop-first, since officers likely use this on a laptop/tablet in the field or office) — Dashboard, Log Inspection, Complaints Queue, Logout

---

## 7. Visual Design Direction

- **Color palette suggestion:** Trust-oriented — deep blue or green as primary (used by most govt/civic apps for credibility), amber/red reserved strictly for warnings/violations, avoid overly playful colors
- **Typography:** Clean, highly legible sans-serif (labels need to be read fast, sometimes by users with low digital literacy)
- **Iconography:** Simple, universally understood icons (checkmarks, warning triangles, shield icons) — avoid text-heavy explanations where an icon can communicate faster
- **Language toggle:** Hindi/English switch visible on every screen (top corner), since this targets a broad national audience

---

## 8. Key UX Principles to Follow Throughout

1. **Never make scanning feel like a chore** — it should feel as easy as taking a regular photo
2. **Never make the consumer feel accused or in trouble** — results should feel informative, not alarming, even when a violation is found
3. **Complaint filing should feel safe, not risky** — the verification step should reassure ("this protects genuine complaints"), not intimidate
4. **Officer tools should feel efficient, not cluttered** — they're using this repeatedly during work, speed matters more than visual polish here
5. **Every screen should answer "what do I do next"** clearly — never leave the user wondering what button to press


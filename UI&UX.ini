# UI/UX & User Flow Documentation
### GrahakKavach — Consumer Protection & Compliance Scanner App
*"Grahak" (consumer) + "Kavach" (shield) — your shield at every purchase*

---

## 1. Design Goals (Keep These in Mind for Every Screen)

- **Zero friction for casual use** — scanning should never require login; only complaint filing does.
- **One photo, complete answer** — no manual circling/selecting sections on the label.
- **Trust and clarity over cleverness** — this app deals with health/legal information, so every screen should feel calm, clear, and credible (not flashy or gamified).
- **Two very different users, two very different experiences** — consumer flow stays simple and visual; officer flow stays structured and form-based.
- **Regional accessibility** — support for Hindi/English toggle where possible, since this targets a broad Indian audience.

---

## 2. User Personas

| Persona | Goal | Tech comfort | Key need |
|---|---|---|---|
| **Consumer (Riya, 28, urban)** | Check if a product is safe/legit before buying | Medium-high | Fast, visual, trustworthy result |
| **Consumer (Ramesh, 45, semi-urban shopkeeper's customer)** | Wants to know if he's being cheated on price/quantity | Low-medium | Simple language, minimal steps |
| **Officer (Inspector, govt employee)** | Log inspections quickly, access history | Medium | Structured, fast data entry, no clutter |

---


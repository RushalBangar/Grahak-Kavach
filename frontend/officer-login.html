<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <title>Officer Portal - Grahak Kavach</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Desktop override for Officer Portal */
    body { background-color: #f1f5f9; background-image: none; }
    .officer-container { max-width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { width: 100%; max-width: 400px; padding: 40px; border-radius: var(--radius-lg); background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="lang-container" style="position: absolute; top: 16px; right: 16px;">
    <select class="lang-switcher">
      <option value="en">EN</option>
      <option value="mr">MR</option>
      <option value="hi">HI</option>
    </select>
  </div>
  <div class="officer-container">
    <div class="login-box animate-slide-up">
      
      <div class="flex-center mb-8">
        <img src="assets/logo.svg" alt="Logo" style="width: 60px; height: 60px; margin-bottom: 16px;">
        <h2 data-i18n="officer_portal" style="margin: 0; color: #1e293b;">Officer Portal</h2>
        <p class="text-muted">Secure Access System</p>
      </div>

      <div id="step-1-form">
        <div class="form-group mb-8">
          <label class="form-label" data-i18n="email_address">Email Address</label>
          <div style="display: flex; align-items: center; background: rgba(0,0,0,0.02); border: 1px solid rgba(0,0,0,0.1); border-radius: var(--radius-md); padding: 0 12px;">
            <input type="email" id="email-input" style="border: none; background: transparent; padding: 12px 0; width: 100%; outline: none;" placeholder="officer@example.com" required>
          </div>
        </div>

        <button id="send-otp-btn" class="btn btn-primary" style="background-color: #1e293b; width: 100%;">
          Send OTP
        </button>
      </div>

      <div id="step-2-form" style="display: none;">
        <div class="form-group mb-8">
          <label class="form-label">Enter 6-digit OTP</label>
          <input type="text" id="otp-input" class="form-control" placeholder="123456" required>
        </div>

        <button id="verify-otp-btn" class="btn btn-primary" style="background-color: #1e293b; width: 100%;">
          Verify & Login
        </button>
      </div>


      <div class="mt-8 text-center" style="font-size: 0.75rem; color: #94a3b8;">
        Unauthorized access is prohibited. All actions are logged.
        <br><br>
        <a href="index.html" style="color: #64748b; text-decoration: underline;">Return to Consumer App</a>
      </div>
    </div>
  </div>
  

  <script defer src="js/translations.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/api.js"></script>
  <script>
      // The API file handles the native OTP backend logic.
      document.getElementById('send-otp-btn').addEventListener('click', async () => {
          const email = document.getElementById('email-input').value.trim();
          if(!email.includes('@')) {
              alert("Please enter a valid email address");
              return;
          }
          await API.sendOTP(email);
      });

      document.getElementById('verify-otp-btn').addEventListener('click', async () => {
          const otp = document.getElementById('otp-input').value.trim();
          if(otp.length !== 6) {
              alert("Enter a 6-digit OTP");
              return;
          }
          await API.verifyOTP(otp);
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

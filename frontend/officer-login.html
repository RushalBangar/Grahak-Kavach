<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <title>Officer Portal - Grahak Kavach</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Desktop override for Officer Portal */
    body { background-color: #f1f5f9; background-image: none; }
    .officer-container { max-width: 100%; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .login-box { width: 100%; max-width: 400px; padding: 40px; border-radius: var(--radius-lg); background: white; box-shadow: 0 10px 40px rgba(0,0,0,0.05); }
  </style>
</head>
<body>
  <div class="lang-container" style="position: absolute; top: 16px; right: 16px;">
    <select class="lang-switcher">
      <option value="en">EN</option>
      <option value="mr">MR</option>
      <option value="hi">HI</option>
    </select>
  </div>
  <div class="officer-container">
    <div class="login-box animate-slide-up">
      
      <div class="flex-center mb-8">
        <img src="assets/logo.svg" alt="Logo" style="width: 60px; height: 60px; margin-bottom: 16px;">
        <h2 data-i18n="officer_portal" style="margin: 0; color: #1e293b;">Officer Portal</h2>
        <p class="text-muted">Secure Access System</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" data-i18n="email_address">Officer ID (Username)</label>
          <input type="text" id="username" class="form-control" placeholder="officer1" data-i18n="email_placeholder" required>
        </div>
        
        <div class="form-group mb-8">
          <label class="form-label" data-i18n="password">Password / OTP</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" data-i18n="password_placeholder" required>
        </div>

        <button type="submit" class="btn btn-primary" style="background-color: #1e293b;" data-i18n="login">
          Secure Login
        </button>
      </form>

      <div class="mt-8 text-center" style="font-size: 0.75rem; color: #94a3b8;">
        Unauthorized access is prohibited. All actions are logged.
        <br><br>
        <a href="index.html" style="color: #64748b; text-decoration: underline;">Return to Consumer App</a>
      </div>
    </div>
  </div>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script>
      document.getElementById('login-form').addEventListener('submit', async (e) => {
          e.preventDefault();
          const username = document.getElementById('username').value;
          const password = document.getElementById('password').value;

          try {
              const data = await API.officerLogin(username, password);
              localStorage.setItem('officer_token', data.access_token);
              window.location.href = 'officer-dashboard.html';
          } catch (err) {
              showToast("Login failed. Check your credentials.", "error");
          }
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

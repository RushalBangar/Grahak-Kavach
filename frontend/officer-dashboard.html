<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Officer Dashboard - Grahak Kavach</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Premium Dashboard UI matching index.html */
    body { background: #f8fafc; margin: 0; padding: 0; font-family: var(--font-family); color: var(--text-color); }
    .dashboard-layout {
      display: flex;
      flex-direction: row;
      min-height: 100vh;
      width: 100vw;
      overflow-x: hidden;
    }
    
    /* Sidebar */
    .sidebar {
      width: 260px;
      background: #1e293b;
      color: white;
      height: 100vh;
      position: sticky;
      top: 0;
      padding: 24px 0;
      display: flex;
      flex-direction: column;
      z-index: 50;
      transition: transform 0.3s ease;
    }
    
    .sidebar-brand { padding: 0 24px; display: flex; align-items: center; gap: 12px; margin-bottom: 40px; }
    .sidebar-nav a { display: flex; align-items: center; gap: 12px; padding: 12px 24px; color: #cbd5e1; text-decoration: none; transition: 0.2s; font-size: 0.95rem; }
    .sidebar-nav a:hover, .sidebar-nav a.active { background: #334155; color: white; border-left: 4px solid var(--primary-color); padding-left: 20px; }
    
    /* Main Panel */
    .main-panel {
      flex: 1;
      padding: 32px 48px;
      min-width: 0; /* Important for flex child truncation */
    }

    /* Mobile Header */
    .mobile-header {
        display: none;
        align-items: center;
        justify-content: space-between;
        padding: 16px 24px;
        background: #1e293b;
        color: white;
        position: sticky;
        top: 0;
        z-index: 40;
    }
    .hamburger { background: none; border: none; color: white; cursor: pointer; padding: 8px; margin-left: -8px; }
    
    /* Table styles - Premium & Responsive */
    .table-responsive { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-lg); box-shadow: var(--glass-shadow); background: white; }
    .data-table { width: 100%; border-collapse: collapse; min-width: 700px; }
    .data-table th, .data-table td { padding: 16px 20px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
    .data-table th { background: #f8fafc; color: #64748b; font-weight: 600; text-transform: uppercase; font-size: 0.75rem; letter-spacing: 0.05em; }
    .data-table tr:hover { background: #f8fafc; }
    .data-table tr:last-child td { border-bottom: none; }

    /* Modal styles */
    .modal-overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(15, 23, 42, 0.7);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 100;
      backdrop-filter: blur(8px);
      padding: 16px;
    }
    .modal-overlay.active { opacity: 1; pointer-events: auto; }
    .modal-content {
      background: white; border-radius: 20px; width: 100%; max-width: 500px;
      transform: translateY(20px) scale(0.95);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
      overflow: hidden;
    }
    .modal-overlay.active .modal-content { transform: translateY(0) scale(1); }
    .modal-header { padding: 24px; border-bottom: 1px solid #f1f5f9; display: flex; justify-content: space-between; align-items: center; background: white; }
    .modal-body { padding: 24px; max-height: 70vh; overflow-y: auto; }
    .close-btn { background: #f1f5f9; border: none; font-size: 1.25rem; color: #64748b; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
    .close-btn:hover { background: #e2e8f0; color: #0f172a; transform: rotate(90deg); }

    /* Mobile overrides */
    @media (max-width: 768px) {
      .dashboard-layout { flex-direction: column; }
      .sidebar {
        position: fixed;
        left: -260px;
        box-shadow: 4px 0 24px rgba(0,0,0,0.1);
      }
      .sidebar.open { transform: translateX(260px); }
      .mobile-header { display: flex; }
      .main-panel { padding: 16px; }
      .flex-between { flex-direction: column; align-items: stretch !important; gap: 16px; }
      .stats-container { display: grid !important; grid-template-columns: 1fr 1fr; width: 100%; box-sizing: border-box; }
      .top-actions { flex-direction: row-reverse; justify-content: space-between; width: 100%; }
      .lang-container { position: relative !important; top: 0 !important; right: 0 !important; }
    }
  </style>
</head>
<body>
  
  <div class="mobile-header">
    <div style="display: flex; align-items: center; gap: 12px;">
        <button class="hamburger" onclick="document.querySelector('.sidebar').classList.toggle('open')">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
        </button>
        <img src="assets/logo.svg" alt="Logo" style="width: 24px; height: 24px; filter: brightness(0) invert(1);">
        <h3 style="margin: 0; font-size: 1.1rem; font-weight: 600;">Grahak Kavach</h3>
    </div>
  </div>

  <div class="dashboard-layout">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <img src="assets/logo.svg" alt="Logo" style="width: 32px; height: 32px; filter: brightness(0) invert(1);">
      <h3 style="margin: 0; font-size: 1.1rem; color: white;">Grahak Kavach</h3>
    </div>
    
    <nav class="sidebar-nav">
      <a href="#" class="active" onclick="if(window.innerWidth<=768) document.querySelector('.sidebar').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        Citizen Complaints
      </a>
      <a href="#" onclick="if(window.innerWidth<=768) document.querySelector('.sidebar').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        Log Inspection
      </a>
      <a href="#" onclick="if(window.innerWidth<=768) document.querySelector('.sidebar').classList.remove('open')">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>
        My Inspections
      </a>
    </nav>

    <div style="margin-top: auto; padding: 24px;">
      <a href="index.html" style="color: #94a3b8; text-decoration: none; font-size: 0.85rem; display: flex; align-items: center; gap: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path><polyline points="16 17 21 12 16 7"></polyline><line x1="21" y1="12" x2="9" y2="12"></line></svg>
        Logout Session
      </a>
    </div>
  </aside>

  <main class="main-panel animate-slide-up" style="position: relative;">
    <div class="lang-container" style="position: absolute; top: 32px; right: 48px; z-index: 10;">
      <select class="lang-switcher">
        <option value="en">EN</option>
        <option value="mr">MR</option>
        <option value="hi">HI</option>
      </select>
    </div>
    
    <div class="flex-between mb-8" style="align-items: flex-end;">
      <div>
        <h2 data-i18n="officer_dashboard" style="font-size: 1.75rem; margin-bottom: 8px; color: #0f172a;">Dashboard</h2>
        <div style="display: flex; gap: 24px; margin-top: 16px; border-bottom: 2px solid rgba(0,0,0,0.05); padding-bottom: 8px; overflow-x: auto; white-space: nowrap;">
          <a href="#" style="text-decoration: none; color: var(--primary-color); font-weight: 600; border-bottom: 2px solid var(--primary-color); padding-bottom: 8px; margin-bottom: -10px;">Citizen Complaints Queue</a>
          <a href="#" style="text-decoration: none; color: var(--text-muted); font-weight: 500; padding-bottom: 8px;">My Inspections</a>
        </div>
      </div>
      <div class="top-actions" style="display: flex; flex-direction: column; align-items: flex-end; gap: 16px;">
        <button class="btn btn-primary" style="display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);" onclick="showToast('Inspection logging modal would open here.', 'success')">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          Log New Inspection
        </button>
        <div class="stats-container" style="background: white; padding: 16px 24px; border-radius: var(--radius-md); box-shadow: var(--glass-shadow); display: flex; gap: 32px; border: 1px solid #f1f5f9;">
          <div>
            <div class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">Open Cases</div>
            <div id="open-count" style="font-size: 1.5rem; font-weight: 700; color: #1e293b; margin-top: 4px;">-</div>
          </div>
          <div style="width: 1px; background: #e2e8f0;"></div>
          <div>
            <div class="text-muted" style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">High Priority</div>
            <div id="high-priority-count" style="font-size: 1.5rem; font-weight: 700; color: var(--danger); margin-top: 4px;">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Data Table -->
    <div class="table-responsive">
      <table class="data-table">
        <thead>
          <tr>
            <th>Tracking ID</th>
            <th>Shop / Details</th>
            <th>Type</th>
            <th>Date Filed</th>
            <th>Priority</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="complaints-queue">
          <!-- Fetched via API, skeleton loading default -->
          <tr>
            <td><div class="skeleton skeleton-text"></div></td>
            <td>
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text short"></div>
            </td>
            <td><div class="skeleton skeleton-text"></div></td>
            <td><div class="skeleton skeleton-text"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton" style="width: 80px; height: 36px; border-radius: 8px;"></div></td>
          </tr>
          <tr>
            <td><div class="skeleton skeleton-text"></div></td>
            <td>
              <div class="skeleton skeleton-text"></div>
              <div class="skeleton skeleton-text short"></div>
            </td>
            <td><div class="skeleton skeleton-text"></div></td>
            <td><div class="skeleton skeleton-text"></div></td>
            <td><div class="skeleton skeleton-text short"></div></td>
            <td><div class="skeleton" style="width: 80px; height: 36px; border-radius: 8px;"></div></td>
          </tr>
        </tbody>
      </table>
    </div>

  <!-- Review Modal HTML -->
    <div class="modal-overlay" id="review-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="margin:0; font-size: 1.25rem; font-weight: 600;">Review Complaint</h3>
                <button class="close-btn" onclick="closeReviewModal()">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
                </button>
            </div>
            <div class="modal-body">
                <div style="background: #f8fafc; padding: 20px; border-radius: 12px; margin-bottom: 24px; border: 1px solid #f1f5f9;">
                    <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px;">
                        <h4 id="modal-tracking-id" style="color: var(--primary-color); margin: 0; font-family: monospace; font-size: 0.9rem; background: var(--primary-light); padding: 4px 8px; border-radius: 4px;">#---</h4>
                    </div>
                    <h2 id="modal-shop-name" style="margin: 0 0 4px 0; color: #0f172a; font-size: 1.25rem;">---</h2>
                    <p id="modal-shop-address" style="margin: 0; color: #64748b; font-size: 0.95rem; line-height: 1.5;">---</p>
                </div>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px;">
                    <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0;">
                        <label style="display:block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px;">Violation Type</label>
                        <strong id="modal-violation-type" style="color: #334155;">---</strong>
                    </div>
                    <div style="background: white; padding: 16px; border-radius: 12px; border: 1px solid #e2e8f0;">
                        <label style="display:block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; margin-bottom: 8px;">Verification</label>
                        <strong id="modal-verification" style="color: #334155;">---</strong>
                    </div>
                </div>

                <div style="margin-bottom: 16px;">
                    <label style="display:block; font-size: 0.85rem; font-weight: 500; color: #475569; margin-bottom: 8px;">Update Status</label>
                    <div style="position: relative;">
                        <select id="modal-status" class="input" style="width: 100%; border: 1px solid #cbd5e1; padding: 14px 16px; border-radius: 12px; appearance: none; background: white; font-size: 1rem; color: #0f172a; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
                            <option value="Pending">Pending</option>
                            <option value="Verified">Verified</option>
                            <option value="In Progress">In Progress</option>
                            <option value="Resolved">Resolved</option>
                        </select>
                        <svg style="position: absolute; right: 16px; top: 14px; pointer-events: none; color: #64748b;" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </div>
                </div>
            </div>
            <div class="modal-footer" style="padding: 24px; border-top: 1px solid #f1f5f9; display: flex; justify-content: flex-end; gap: 12px; background: #f8fafc;">
                <button class="btn btn-secondary" style="padding: 12px 24px; background: white; border: 1px solid #e2e8f0; color: #475569; font-weight: 500;" onclick="closeReviewModal()">Cancel</button>
                <button id="save-status-btn" class="btn btn-primary" style="padding: 12px 24px; font-weight: 500; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);" onclick="saveComplaintStatus()">Save Changes</button>
            </div>
        </div>
    </div>

  </main>
  </div>
  
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script>
      let currentQueue = [];
      let activeTrackingId = null;

      function openReviewModal(trackingId) {
          const comp = currentQueue.find(c => c.tracking_id === trackingId);
          if(!comp) return;
          
          activeTrackingId = trackingId;
          document.getElementById('modal-tracking-id').textContent = '#' + comp.tracking_id;
          document.getElementById('modal-shop-name').textContent = comp.shop.name;
          document.getElementById('modal-shop-address').textContent = comp.shop.address;
          document.getElementById('modal-violation-type').textContent = comp.violation_type;
          document.getElementById('modal-verification').textContent = comp.verification_method;
          document.getElementById('modal-status').value = comp.status;
          
          document.getElementById('review-modal').classList.add('active');
      }
      
      function closeReviewModal() {
          document.getElementById('review-modal').classList.remove('active');
      }

      async function saveComplaintStatus() {
          if(!activeTrackingId) return;
          const newStatus = document.getElementById('modal-status').value;
          
          try {
              document.getElementById('save-status-btn').textContent = 'Saving...';
              await API.updateComplaintStatus(activeTrackingId, newStatus);
              
              if(typeof showToast === 'function') { showToast('Status updated successfully', 'success'); }
              closeReviewModal();
              loadDashboardData(); // Reload the table
          } catch(e) {
              console.error(e);
              if(typeof showToast === 'function') { showToast('Failed to update status', 'error'); }
          } finally {
              document.getElementById('save-status-btn').textContent = 'Save Changes';
          }
      }

      async function loadDashboardData() {
          try {
              currentQueue = await API.getComplaintsQueue();
              const tbody = document.getElementById('complaints-queue');
              tbody.innerHTML = '';
              
              let openCount = 0;
              let highPriorityCount = 0;

              if (currentQueue.length === 0) {
                  tbody.innerHTML = '<tr><td colspan="7" class="text-center" style="padding: 24px; color: #64748b;">No complaints in queue.</td></tr>';
                  document.getElementById('open-count').textContent = 0;
                  document.getElementById('high-priority-count').textContent = 0;
                  return;
              }

              currentQueue.forEach(comp => {
                  if (comp.status !== 'Resolved') openCount++;
                  
                  const isHighPriority = comp.violation_type === 'Food Safety' || comp.violation_type === 'Both';
                  if (isHighPriority && comp.status !== 'Resolved') highPriorityCount++;
                  
                  const priority = isHighPriority ? 'High' : 'Medium';
                  const badgeClass = priority === 'High' ? 'badge-danger' : 'badge-warning';
                  
                  // Status badge coloring
                  let statusColor = '#94a3b8'; // grey
                  if(comp.status === 'Pending') statusColor = '#eab308'; // yellow
                  if(comp.status === 'Verified') statusColor = '#3b82f6'; // blue
                  if(comp.status === 'In Progress') statusColor = '#8b5cf6'; // purple
                  if(comp.status === 'Resolved') statusColor = '#10b981'; // green

                  const dateStr = new Date(comp.date_filed).toLocaleDateString();

                  tbody.innerHTML += `
                    <tr>
                      <td style="font-family: monospace; color: #64748b;">#${comp.tracking_id}</td>
                      <td>
                        <strong>${comp.shop ? comp.shop.name : 'Unknown Shop'}</strong><br>
                        <span style="color: #64748b; font-size: 0.8rem; display: block; max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">
                            ${comp.shop ? comp.shop.address : 'No address provided'}
                        </span>
                      </td>
                      <td>${comp.violation_type} Violation</td>
                      <td>${dateStr}</td>
                      <td><span class="badge ${badgeClass}">${priority}</span></td>
                      <td>
                        <span style="display: inline-block; padding: 4px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 600; background: ${statusColor}22; color: ${statusColor};">
                            ${comp.status}
                        </span>
                      </td>
                      <td><button class="btn btn-secondary" style="padding: 6px 12px; font-size: 0.8rem;" onclick="openReviewModal('${comp.tracking_id}')">Review</button></td>
                    </tr>
                  `;
              });
              
              document.getElementById('open-count').textContent = openCount;
              document.getElementById('high-priority-count').textContent = highPriorityCount;

          } catch (e) {
              console.error(e);
              document.getElementById('complaints-queue').innerHTML = '<tr><td colspan="7" class="text-center text-danger" style="padding:24px;">Failed to load queue. Please ensure the backend is running.</td></tr>';
          }
      }

      document.addEventListener('DOMContentLoaded', () => {
          // Check auth
          const token = localStorage.getItem('officer_token');
          if (!token) {
              window.location.href = 'officer-login.html';
              return;
          }
          loadDashboardData();
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

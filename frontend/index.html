<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grahak Kavach - Your shield at every purchase</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <div class="content flex-center text-center animate-slide-up" style="flex: 1; padding: 32px;">
      
      <!-- Logo Container -->
      <div class="mb-4" style="width: 120px; height: 120px; background: white; border-radius: 50%; padding: 24px; box-shadow: var(--glass-shadow); display: inline-flex; align-items: center; justify-content: center;">
        <img src="assets/logo.svg" alt="Grahak Kavach Logo" style="width: 100%; height: 100%;">
      </div>

      <h1>Grahak Kavach</h1>
      <p class="text-muted mb-8" style="font-size: 1.1rem;">Your shield at every purchase</p>

      <div class="glass-panel" style="width: 100%; padding: 32px 24px; display: flex; flex-direction: column; gap: 16px;">
        <h3 style="margin-bottom: 8px;">Check Product Safety</h3>
        <p class="text-muted" style="font-size: 0.9rem; margin-bottom: 16px;">Scan any product label to instantly verify compliance, ingredients, and safety warnings.</p>
        
        <a href="scan.html" class="btn btn-primary" style="padding: 16px;">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>
          Scan a Product
        </a>
      </div>

    </div>

    <!-- Bottom Action for Officer (De-emphasized) -->
    <div style="padding: 24px; text-align: center;">
      <a href="officer-login.html" class="btn btn-secondary" style="font-size: 0.875rem; padding: 10px 16px; width: auto; border-radius: 8px;">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
        I'm an Officer
      </a>
    </div>

  </div>
  <script src="js/main.js"></script>
</body>
</html>

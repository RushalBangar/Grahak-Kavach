<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scan Product - Grahak Kavach</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    .viewfinder {
      position: relative;
      width: 100%;
      height: 60vh;
      background: #000;
      border-radius: var(--radius-lg);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .viewfinder-frame {
      width: 80%;
      height: 60%;
      border: 2px dashed rgba(255,255,255,0.7);
      border-radius: 12px;
      position: relative;
    }
    .viewfinder-frame::before {
      content: '';
      position: absolute;
      top: -2px; left: -2px; right: -2px; bottom: -2px;
      border: 2px solid transparent;
      border-radius: 12px;
      background: linear-gradient(var(--primary-color), var(--primary-color)) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: scan 2s linear infinite;
      opacity: 0.5;
    }
    @keyframes scan {
      0% { clip-path: inset(0 0 95% 0); }
      50% { clip-path: inset(45% 0 45% 0); }
      100% { clip-path: inset(95% 0 0 0); }
    }
    .scan-overlay {
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
    }
    .loader-line {
      width: 150px;
      height: 4px;
      background: rgba(255,255,255,0.2);
      border-radius: 4px;
      margin-bottom: 16px;
      overflow: hidden;
      position: relative;
    }
    .loader-line::after {
      content: '';
      position: absolute;
      top: 0; left: -50px;
      width: 50px;
      height: 100%;
      background: var(--primary-color);
      box-shadow: 0 0 10px var(--primary-color);
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes loading {
      0% { left: -50px; }
      100% { left: 150px; }
    }
  </style>

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J4HZYJ6RHJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-J4HZYJ6RHJ');
  </script>
</head>
<body>
  <div class="app-container">
    
    <div class="header glass-header">
      <a href="index.html" style="color: var(--text-main);">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      </a>
      <h3 data-i18n="scan_label_title" style="margin: 0; font-size: 1.1rem;">Scan Label</h3>
      <div style="width: auto;">
        <select class="lang-switcher">
          <option value="en">EN</option>
          <option value="mr">MR</option>
          <option value="hi">HI</option>
        </select>
      </div>
    </div>

    <div class="content animate-slide-up">
      <!-- Tabs for OCR vs Barcode -->
      <div style="display: flex; gap: 16px; margin: 0 16px 16px 16px; border-bottom: 1px solid rgba(0,0,0,0.1);">
        <button id="tab-ocr" class="btn" style="flex: 1; background: none; border: none; border-bottom: 2px solid var(--primary-color); border-radius: 0; color: var(--primary-color); font-weight: bold; padding: 12px 0;" onclick="switchScanMode('ocr')">Text Label OCR</button>
        <button id="tab-barcode" class="btn" style="flex: 1; background: none; border: none; color: var(--text-muted); font-weight: bold; padding: 12px 0;" onclick="switchScanMode('barcode')">Barcode Scan</button>
      </div>

      <!-- OCR Section -->
      <div id="section-ocr">
        <div class="viewfinder mb-4 shadow" style="position: relative;">
          <!-- Flashlight Button -->
          <div class="camera-controls">
            <button id="toggle-flash" style="border: none; background: rgba(0,0,0,0.5); border-radius: 50%; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: white;">
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.9 1.3 1.5 1.5 2.5"></path><path d="M9 18h6"></path><path d="M10 22h4"></path></svg>
            </button>
          </div>

          <!-- Real Camera Feed -->
          <video id="camera-feed" autoplay playsinline style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1;"></video>
          
          <!-- UI overlay for scanning -->
          <div class="viewfinder-frame" style="z-index: 2;"></div>
          <p data-i18n="fit_label" style="position: absolute; bottom: 24px; color: white; text-align: center; width: 100%; font-size: 0.85rem; opacity: 0.8; z-index: 2; text-shadow: 0 1px 3px rgba(0,0,0,0.8);">Fit the label inside this frame</p>
          
          <!-- Hidden canvas to grab image -->
          <canvas id="camera-canvas" style="display: none;"></canvas>
        </div>
        
        <p data-i18n="make_sure_visible" class="text-center text-muted mb-4" style="font-size: 0.85rem;">Make sure MRP, ingredients, and dates are visible.</p>

        <div class="flex-row" style="gap: 16px; padding: 0 16px;">
          <button id="start-scan" class="btn btn-primary" style="flex: 2; padding: 18px;" data-i18n="capture">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg> Capture
          </button>
          
          <label class="btn btn-secondary" style="flex: 1; padding: 18px; cursor: pointer;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>
            <input type="file" id="file-upload" accept="image/*" style="display: none;">
          </label>
        </div>
      </div>

      <!-- Barcode Section -->
      <div id="section-barcode" style="display: none; padding: 0 16px;">
        <div style="background: white; padding: 24px; border-radius: var(--radius-lg); box-shadow: var(--glass-shadow); margin-bottom: 24px;">
            <div style="text-align: center; margin-bottom: 24px;">
                <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--primary-color)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5v14"></path><path d="M8 5v14"></path><path d="M12 5v14"></path><path d="M17 5v14"></path><path d="M21 5v14"></path></svg>
            </div>
            <h3 style="margin-top: 0; text-align: center;">Verify Product Authenticity</h3>
            <p class="text-muted text-center">Enter the EAN/UPC barcode number to check against the Open Food Facts database.</p>
            
            <input type="number" id="barcode-input" class="form-control glass-input mb-4" placeholder="e.g. 5449000000996 (Coke)" style="font-size: 1.2rem; text-align: center; letter-spacing: 2px;">
            
            <div class="form-group mb-4" style="display: flex; justify-content: center;">
              <div class="g-recaptcha" data-sitekey="6LeIxAcTAAAAAJcZVRqyHh71UMIEGNQ_MXjiZKhI"></div>
            </div>
            
            <button class="btn btn-primary" style="width: 100%; padding: 16px;" onclick="verifyBarcode()">
                Check Barcode
            </button>
        </div>
      </div>

    </div>

    <!-- Processing Overlay (Screen 3) -->
    <div id="processing-overlay" class="scan-overlay">
      <div class="loader-line"></div>
      <h3 data-i18n="reading_label" style="color: white;">Reading label...</h3>
      <p data-i18n="checking_compliance" style="color: rgba(255,255,255,0.7); font-size: 0.9rem;">Checking compliance rules</p>
    </div>

  </div>
  <script defer src="js/translations.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/main.js"></script>
  <script>
    function switchScanMode(mode) {
        if (mode === 'ocr') {
            document.getElementById('section-ocr').style.display = 'block';
            document.getElementById('section-barcode').style.display = 'none';
            document.getElementById('tab-ocr').style.borderBottom = '2px solid var(--primary-color)';
            document.getElementById('tab-ocr').style.color = 'var(--primary-color)';
            document.getElementById('tab-barcode').style.borderBottom = 'none';
            document.getElementById('tab-barcode').style.color = 'var(--text-muted)';
        } else {
            document.getElementById('section-ocr').style.display = 'none';
            document.getElementById('section-barcode').style.display = 'block';
            document.getElementById('tab-barcode').style.borderBottom = '2px solid var(--primary-color)';
            document.getElementById('tab-barcode').style.color = 'var(--primary-color)';
            document.getElementById('tab-ocr').style.borderBottom = 'none';
            document.getElementById('tab-ocr').style.color = 'var(--text-muted)';
        }
    }

    async function verifyBarcode() {
        const barcode = document.getElementById('barcode-input').value.trim();
        if (!barcode) {
            if(typeof showToast === 'function') { showToast('Please enter a barcode.', 'warning'); } else { alert('Please enter a barcode.'); }
            return;
        }

        try {
            const captchaToken = grecaptcha.getResponse();
            if (!captchaToken) {
                if(typeof showToast === 'function') { showToast('Please complete the CAPTCHA verification.', 'error'); } else { alert('Please complete the CAPTCHA verification.'); }
                return;
            }

            document.getElementById('processing-overlay').style.display = 'flex';
            document.querySelector('#processing-overlay h3').textContent = 'Querying Global DB...';
            document.querySelector('#processing-overlay p').textContent = 'Validating FSSAI / Authenticity';
            
            const data = await API.scanBarcode(barcode, captchaToken);
            
            if (data.found) {
                // Store results for the results page
                const scanRes = {
                    extracted_text: "BARCODE MATCH: " + barcode,
                    food_safety: {
                        health_score: data.nutriscore_grade,
                        harmful_ingredients: data.nova_group > 3 ? ["Ultra-Processed (Nova 4)"] : []
                    },
                    legal_metrology: {
                        is_compliant: true,
                        details: `Product: ${data.product_name} by ${data.brand}`
                    }
                };
                localStorage.setItem('latest_scan_result', JSON.stringify(scanRes));
                window.location.href = 'results.html';
            } else {
                if(typeof showToast === 'function') { showToast('Product not found in global database. Potential counterfeit!', 'error'); } else { alert('Product not found in database. Potential counterfeit!'); }
            }
        } catch (e) {
            console.error(e);
            if(typeof showToast === 'function') { showToast('Failed to check barcode.', 'error'); } else { alert('Failed to check barcode.'); }
        } finally {
            document.getElementById('processing-overlay').style.display = 'none';
        }
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

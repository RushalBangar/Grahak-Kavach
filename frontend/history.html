<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop History - Grahak Kavach</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    
    <div class="header glass-header" style="justify-content: space-between;">
      <h3 data-i18n="shop_history" style="margin: 0; font-size: 1.1rem; width: auto; text-align: left;">Shop History Lookup</h3>
      <div style="width: auto;">
        <select class="lang-switcher">
          <option value="en">EN</option>
          <option value="mr">MR</option>
          <option value="hi">HI</option>
        </select>
      </div>
    </div>

    <div class="content animate-slide-up" style="padding-bottom: 80px;">
      
      <div class="form-group">
        <div style="position: relative;">
          <input type="text" id="shop-search" class="form-control glass-input" placeholder="Search by shop name or PIN code..." style="padding-left: 40px; border-radius: var(--radius-full);">
          <svg style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <h4 class="mt-2 mb-4" style="font-size: 0.95rem;">Search Results</h4>

      <div id="results-container">
          <!-- Default Mock Shop Card -->
          <div class="glass-card mb-4" style="padding: 16px;">
            <div class="flex-between mb-2">
              <h4 style="margin: 0; font-size: 1.05rem;">Ramesh Provisions</h4>
              <span class="badge badge-success">Compliant</span>
            </div>
            <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 12px;">12, Main Market Road, Andheri West</p>
            
            <div style="display: flex; gap: 16px; font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 12px;">
              <div>
                <div style="font-weight: 600; color: var(--text-main);">Aug 10, 2026</div>
                <div class="text-muted">Last Inspection</div>
              </div>
              <div>
                <div style="font-weight: 600; color: var(--success);">0</div>
                <div class="text-muted">Active Complaints</div>
              </div>
            </div>
          </div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav glass-nav">
      <a href="scan.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        <span data-i18n="scan_nav">Scan</span>
      </a>
      <a href="history.html" class="nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span data-i18n="history_nav">History</span>
      </a>
      <a href="complaint.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
        <span data-i18n="complaints_nav">Complaints</span>
      </a>
    </div>

  </div>
  <script src="js/translations.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script>
      let searchTimeout;
      document.getElementById('shop-search').addEventListener('input', (e) => {
          clearTimeout(searchTimeout);
          const query = e.target.value;
          const container = document.getElementById('results-container');
          
          if(query.length < 2) return; // only search if > 2 chars
          
          // Show skeleton loader
          container.innerHTML = `
            <div class="glass-card mb-4 skeleton" style="padding: 16px; height: 120px; border-radius: var(--radius-lg);"></div>
            <div class="glass-card mb-4 skeleton" style="padding: 16px; height: 120px; border-radius: var(--radius-lg);"></div>
          `;

          searchTimeout = setTimeout(async () => {
              try {
                  const shops = await API.searchShops(query);
                  container.innerHTML = ''; // clear

                  if(shops.length === 0) {
                      container.innerHTML = '<p class="text-center text-muted">No shops found matching your query.</p>';
                      return;
                  }

                  shops.forEach(shop => {
                      // simple mock status logic since db doesn't have status field directly
                      const isCompliant = shop.id % 2 === 0; 
                      
                      container.innerHTML += `
                      <div class="glass-card mb-4" style="padding: 16px;">
                        <div class="flex-between mb-2">
                          <h4 style="margin: 0; font-size: 1.05rem;">${shop.name}</h4>
                          <span class="badge badge-${isCompliant ? 'success' : 'warning'}">${isCompliant ? 'Compliant' : 'Under Review'}</span>
                        </div>
                        <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 12px;">${shop.address}</p>
                        
                        <div style="display: flex; gap: 16px; font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 12px;">
                          <div>
                            <div style="font-weight: 600; color: var(--text-main);">Recently</div>
                            <div class="text-muted">Last Inspection</div>
                          </div>
                          <div>
                            <div style="font-weight: 600; color: var(--text-main);">-</div>
                            <div class="text-muted">Active Complaints</div>
                          </div>
                        </div>
                      </div>`;
                  });
              } catch (e) {
                  console.error(e);
                  container.innerHTML = '<p class="text-center text-danger">Error fetching results.</p>';
              }
          }, 500); // 500ms debounce
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

            "on-tertiary-container": "#ffffff", "surface-container-highest": "#dee4de", "outline": "#6e7a71",

<body class="bg-surface text-on-surface font-body-md min-h-[100dvh] flex flex-col antialiased">
  
  <!-- Header (TopAppBar) -->
  <header class="bg-surface/90 backdrop-blur-md border-b border-outline-variant/30 sticky top-0 z-40 w-full px-4 py-3 flex justify-between items-center transition-all duration-300">
    <div class="flex items-center gap-2">
      <h1 class="font-headline-sm text-headline-sm font-bold text-primary tracking-tight" data-i18n="shop_history">Shop History Lookup</h1>
    </div>
    <div class="relative">
      <select class="lang-switcher bg-surface-container-low text-primary font-label-bold text-xs pl-3 pr-8 py-1.5 rounded-full border border-outline-variant hover:bg-surface-container-high transition-colors appearance-none cursor-pointer outline-none shadow-sm">
        <option value="en">EN</option>
        <option value="mr">MR</option>
        <option value="hi">HI</option>
      </select>
      <span class="material-symbols-outlined text-[16px] absolute right-2.5 top-1/2 -translate-y-1/2 pointer-events-none text-primary">expand_more</span>
    </div>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 w-full max-w-md mx-auto px-4 pt-6 pb-24 flex flex-col gap-6">
    
    <!-- Search Bar -->
    <div class="relative w-full">
      <span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline text-[22px]">search</span>
      <input type="text" id="shop-search" class="w-full bg-surface-container-lowest border-2 border-outline-variant/50 focus:border-primary focus:ring-4 focus:ring-primary/10 rounded-full py-3.5 pl-12 pr-4 text-[15px] font-body-md text-text-ink placeholder:text-outline transition-all shadow-sm" placeholder="Search by shop name or PIN code...">
    </div>

    <div>
        <h4 class="font-headline-sm text-[16px] text-text-ink font-bold mb-4">Search Results</h4>
        
        <div id="results-container" class="flex flex-col gap-4">
            <div class="text-center text-outline font-body-md py-10" id="loading-msg">Loading recent complaints...</div>
        </div>
    </div>
    
  </main>

  <!-- Bottom Navigation (Shared Component) -->
  <nav class="fixed bottom-0 w-full bg-surface-container-lowest/90 backdrop-blur-md border-t border-outline-variant/30 pb-safe pt-2 px-6 flex justify-between items-center z-50 shadow-[0_-4px_20px_rgba(0,0,0,0.05)]">
    <a href="scan.html" class="nav-item flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors min-w-[64px]">
      <span class="material-symbols-outlined nav-icon text-2xl" style="font-variation-settings: 'FILL' 0;">qr_code_scanner</span>
      <span class="font-label-bold text-[10px] tracking-wide" data-i18n="scan_nav">Scan</span>
    </a>
    
    <a href="history.html" class="nav-item active flex flex-col items-center gap-1 p-2 text-primary transition-colors min-w-[64px]">
      <div class="relative">
        <span class="material-symbols-outlined nav-icon text-2xl" style="font-variation-settings: 'FILL' 1;">history</span>
      </div>
      <span class="font-label-bold text-[10px] tracking-wide" data-i18n="history_nav">History</span>
    </a>
    
    <a href="complaint.html" class="nav-item flex flex-col items-center gap-1 p-2 text-on-surface-variant hover:text-primary transition-colors min-w-[64px]">
      <span class="material-symbols-outlined nav-icon text-2xl" style="font-variation-settings: 'FILL' 0;">assignment</span>
      <span class="font-label-bold text-[10px] tracking-wide" data-i18n="complaints_nav">Complaints</span>
    </a>
  </nav>

  <script defer src="js/translations.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/main.js"></script>
  <script>
      let allComplaints = [];

      async function loadComplaints() {
          const container = document.getElementById('results-container');
          try {
              if (typeof API === 'undefined') {
                  throw new Error("API not loaded");
              }
              const complaints = await API.getComplaintsQueue();
              allComplaints = complaints;
              renderComplaints(complaints);
          } catch (e) {
              console.error(e);
              container.innerHTML = `<div class="text-center font-body-md py-10 text-error">Failed to load complaints. ${e.message}</div>`;
          }
      }

      function renderComplaints(complaintsList) {
          const container = document.getElementById('results-container');
          container.innerHTML = '';
          
          if(complaintsList.length === 0) {
              container.innerHTML = '<p class="text-center text-outline font-body-md py-10">No recent complaints found.</p>';
              return;
          }

          complaintsList.forEach(c => {
              const dateStr = new Date(c.date_filed).toLocaleDateString('en-IN', {
                  day: 'numeric', month: 'short', year: 'numeric'
              });
              
              const isResolved = c.status === 'Resolved';
              const shopName = c.shop ? c.shop.name : c.shop_name;
              
              const badgeClass = isResolved 
                    ? "bg-[#D1FAE5] text-[#047857] border-[#A7F3D0]" 
                    : "bg-[#FEF3C7] text-[#B45309] border-[#FDE68A]";
                    
              const verifyColor = c.is_verified ? "text-safe-green" : "text-outline";
              
              container.innerHTML += `
              <div class="bg-surface-container-lowest rounded-2xl border border-outline-variant/40 p-4 shadow-sm hover:shadow-md transition-shadow">
                <div class="flex justify-between items-start mb-3">
                  <h4 class="font-headline-sm text-[15px] text-text-ink font-bold m-0 tracking-tight">ID: #${c.tracking_id}</h4>
                  <span class="px-2.5 py-1 rounded-full border text-[11px] font-bold leading-none ${badgeClass}">${c.status}</span>
                </div>
                
                <div class="flex flex-col gap-1 mb-4">
                  <p class="font-body-md text-[14px] text-on-surface-variant flex items-start gap-2">
                    <span class="material-symbols-outlined text-[18px] text-outline shrink-0 mt-0.5">storefront</span>
                    <span><strong>${shopName}</strong></span>
                  </p>
                  <p class="font-body-md text-[14px] text-on-surface-variant flex items-start gap-2">
                    <span class="material-symbols-outlined text-[18px] text-outline shrink-0 mt-0.5">warning</span>
                    <span>${c.violation_type} <span class="text-[12px] opacity-75">(${c.routed_to})</span></span>
                  </p>
                </div>
                
                <div class="flex gap-6 border-t border-outline-variant/30 pt-3">
                  <div class="flex flex-col">
                    <span class="font-label-bold text-[12px] text-on-surface-variant uppercase tracking-wider mb-0.5">Date Filed</span>
                    <span class="font-body-md text-[14px] text-text-ink font-semibold">${dateStr}</span>
                  </div>
                  <div class="flex flex-col">
                    <span class="font-label-bold text-[12px] text-on-surface-variant uppercase tracking-wider mb-0.5">Verified</span>
                    <span class="font-body-md text-[14px] font-bold ${verifyColor}">${c.is_verified ? 'Yes' : 'No'}</span>
                  </div>
                </div>
              </div>
              `;
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
          loadComplaints();
          
          document.getElementById('shop-search').addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase().trim();
              if(!query) {
                  renderComplaints(allComplaints);
                  return;
              }
              
              const filtered = allComplaints.filter(c => {
                  const sName = c.shop ? c.shop.name.toLowerCase() : (c.shop_name || "").toLowerCase();
                  const tId = c.tracking_id.toLowerCase();
                  return sName.includes(query) || tId.includes(query);
              });
              
              renderComplaints(filtered);
          });
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>

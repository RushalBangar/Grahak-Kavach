<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop History - Grahak Kavach</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#10b981">
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">

  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-J4HZYJ6RHJ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-J4HZYJ6RHJ');
  </script>
</head>
<body>
  <div class="app-container">
    
    <div class="header glass-header" style="justify-content: space-between;">
      <h3 data-i18n="shop_history" style="margin: 0; font-size: 1.1rem; width: auto; text-align: left;">Shop History Lookup</h3>
      <div style="width: auto;">
        <select class="lang-switcher">
          <option value="en">EN</option>
          <option value="mr">MR</option>
          <option value="hi">HI</option>
        </select>
      </div>
    </div>

    <div class="content animate-slide-up" style="padding-bottom: 80px;">
      
      <div class="form-group">
        <div style="position: relative;">
          <input type="text" id="shop-search" class="form-control glass-input" placeholder="Search by shop name or PIN code..." style="padding-left: 40px; border-radius: var(--radius-full);">
          <svg style="position: absolute; left: 14px; top: 12px; color: var(--text-muted);" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        </div>
      </div>

      <h4 class="mt-2 mb-4" style="font-size: 0.95rem;">Search Results</h4>

      <div id="results-container">
          <div class="text-center text-muted" id="loading-msg" style="padding: 2rem;">Loading recent complaints...</div>
      </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav glass-nav">
      <a href="scan.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><circle cx="12" cy="12" r="3"></circle></svg>
        <span data-i18n="scan_nav">Scan</span>
      </a>
      <a href="history.html" class="nav-item active">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span data-i18n="history_nav">History</span>
      </a>
      <a href="complaint.html" class="nav-item">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 15s1-1 4-1 5 2 8 2 4-1 4-1V3s-1 1-4 1-5-2-8-2-4 1-4 1z"></path><line x1="4" y1="22" x2="4" y2="15"></line></svg>
        <span data-i18n="complaints_nav">Complaints</span>
      </a>
    </div>

  </div>
  <script defer src="js/translations.js"></script>
  <script defer src="js/i18n.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/main.js"></script>
  <script>
      let allComplaints = [];

      async function loadComplaints() {
          const container = document.getElementById('results-container');
          try {
              if (typeof API === 'undefined') {
                  throw new Error("API not loaded");
              }
              const complaints = await API.getComplaintsQueue();
              allComplaints = complaints;
              renderComplaints(complaints);
          } catch (e) {
              console.error(e);
              container.innerHTML = `<div class="text-center text-muted" style="color:var(--danger)!important;">Failed to load complaints. ${e.message}</div>`;
          }
      }

      function renderComplaints(complaintsList) {
          const container = document.getElementById('results-container');
          container.innerHTML = '';
          
          if(complaintsList.length === 0) {
              container.innerHTML = '<p class="text-center text-muted">No recent complaints found.</p>';
              return;
          }

          complaintsList.forEach(c => {
              const dateStr = new Date(c.date_filed).toLocaleDateString('en-IN', {
                  day: 'numeric', month: 'short', year: 'numeric'
              });
              
              const isResolved = c.status === 'Resolved';
              const shopName = c.shop ? c.shop.name : c.shop_name;
              
              container.innerHTML += `
              <div class="glass-card mb-4" style="padding: 16px;">
                <div class="flex-between mb-2">
                  <h4 style="margin: 0; font-size: 1.05rem;">ID: ${c.tracking_id}</h4>
                  <span class="badge badge-${isResolved ? 'success' : 'warning'}">${c.status}</span>
                </div>
                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 4px;">Shop: <strong>${shopName}</strong></p>
                <p class="text-muted" style="font-size: 0.85rem; margin-bottom: 12px;">Violation: ${c.violation_type} (${c.routed_to})</p>
                
                <div style="display: flex; gap: 16px; font-size: 0.85rem; border-top: 1px solid rgba(0,0,0,0.05); padding-top: 12px;">
                  <div>
                    <div style="font-weight: 600; color: var(--text-main);">${dateStr}</div>
                    <div class="text-muted">Date Filed</div>
                  </div>
                  <div>
                    <div style="font-weight: 600; color: ${c.is_verified ? 'var(--success)' : 'var(--text-muted)'};">${c.is_verified ? 'Yes' : 'No'}</div>
                    <div class="text-muted">Verified</div>
                  </div>
                </div>
              </div>
              `;
          });
      }

      window.addEventListener('DOMContentLoaded', () => {
          loadComplaints();
          
          document.getElementById('shop-search').addEventListener('input', (e) => {
              const query = e.target.value.toLowerCase().trim();
              if(!query) {
                  renderComplaints(allComplaints);
                  return;
              }
              
              const filtered = allComplaints.filter(c => {
                  const sName = c.shop ? c.shop.name.toLowerCase() : (c.shop_name || "").toLowerCase();
                  const tId = c.tracking_id.toLowerCase();
                  return sName.includes(query) || tId.includes(query);
              });
              
              renderComplaints(filtered);
          });
      });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => {
          console.log('SW registration failed: ', err);
        });
      });
    }
  </script>
</body>
</html>
